scenario: message_submit
status: production_parity
runtime_dispatch: true
description: |
  Pass #37 (Section A 8/8): port message.submit from
  legacy_scenarios.rs::handle_message_submit + handle_handoff_message_submit.
  Closes the last legacy dispatch arm in Section A.

  No new primitives. Uses payload_template_json + condition (Pass #34) +
  foreach with outer-condition gating (Pass #35 + post-Pass-#36 audit fixup).

  ## Branch authority

  `@message_submit_branch` (Rust generator) inspects params and returns:
    - "handoff": when params.handoff_packet_id is present OR params.text
      contains "VAC Web Handoff Packet"
    - "normal": otherwise

  Mirrors the Pass #34 @handoff_dispatch_outcome pattern. Branch authority
  lives in Rust; the YAML only consumes the result via
  `condition: { binding: branch, equals: ... }`.

  ## Normal branch (`branch == "normal"`)

  Emits 9 events + final response:
    1. transcript.message_added (assistant role, fixed timestamp)
    2-6. transcript.delta x 5 via foreach over @message_submit_chunks
         (chunks: "I'll ", "edit ", "a ", "file.", ""). The outer foreach
         step gate `branch == "normal"` is the canonical post-Pass-#36 audit
         fixup demonstration: handoff branch skips the entire foreach.
    7. transcript.completed (usage tokens)
    8. tool_call.pending (canonical edit_file shape)
    9. review.changeset_updated (1 file, modified)
  Counter bumps: +2 (msg_id, tool_call_id).

  ## Handoff branch (`branch == "handoff"`)

  Emits 3 events + final response, gated by @message_submit_outcome:
    1. handoff.execution_progress (status=started, completed=0)
    2a. handoff.execution_progress (status=completed, completed=1)
        when outcome == "success"
    2b. handoff.execution_progress (status=failed, completed=0)
        when outcome == "failure"
    3a. handoff.completed (outcome.status=success, tasks_completed=["t1"])
        when outcome == "success"
    3b. handoff.failed (outcome.status=failed, tasks_failed=["t1"])
        when outcome == "failure"
  Counter bumps: +1 (exec_sid).

  ## Wire-byte deviation #3 (post-Pass-#36 precedent)

  Legacy normal returned `{ok:true, message_id}` only.
  Legacy handoff returned `{ok:true, executor_session_id}` only.
  Runtime-dispatched returns BOTH fields, with the unused field as empty
  string. The migrated legacy parity test
  `mock_executor_progress_still_completes_from_message_submit_via_runtime_dispatch`
  still passes (asserts `is_string()` + `ok==true`; "" is_string() returns true).
  Cockpit consumers are field-tolerant per audit on Pass #36.

input:
  command: message.submit
  payload:
    handoff_packet_id: "<optional; presence routes to handoff branch>"
    text: "<optional; if contains 'VAC Web Handoff Packet' routes to handoff branch>"
    force_failure: "<optional bool; routes handoff branch to failure outcome>"
    mode: "<optional 'fail' alias for force_failure>"

state_seeds:
  branch: '@message_submit_branch'
  msg_id: '@message_submit_msg_id'
  tool_call_id: '@message_submit_tool_call_id'
  executor_session_id: '@message_submit_exec_sid'
  packet_id: '@message_submit_packet_id'
  outcome: '@message_submit_outcome'
  chunks: '@message_submit_chunks'

timeline:
  # ---------- Normal branch (9 events) ----------
  - event: transcript.message_added
    condition: { binding: branch, equals: "normal" }
    payload_template: '{"message_id":"${msg_id}","role":"assistant","created_at":"2026-04-24T10:00:00Z"}'
  - foreach:
      binding: chunks
      as: chunk
    condition: { binding: branch, equals: "normal" }
    body:
      - event: transcript.delta
        payload_template: '{"message_id":"${msg_id}","delta":"${chunk.delta}"}'
  - event: transcript.completed
    condition: { binding: branch, equals: "normal" }
    payload_template: '{"message_id":"${msg_id}","usage":{"input_tokens":10,"output_tokens":5}}'
  - event: tool_call.pending
    condition: { binding: branch, equals: "normal" }
    payload_template: '{"tool_call_id":"${tool_call_id}","tool":"edit_file","risk":"medium","summary":"Edit src/foo.ts","args":{"path":"src/foo.ts","patch":"-- old\n++ new\n"},"created_at":"2026-04-24T10:00:01Z"}'
  - event: review.changeset_updated
    condition: { binding: branch, equals: "normal" }
    payload:
      files:
        - path: "src/foo.ts"
          status: "modified"
          additions: 3
          deletions: 1
  # ---------- Handoff branch (3 events; 1 shared + 2 outcome-gated) ----------
  - event: handoff.execution_progress
    condition: { binding: branch, equals: "handoff" }
    payload_template: '{"packet_id":"${packet_id}","executor_session_id":"${executor_session_id}","task_id":"t1","current_task":"t1","status":"started","completed":0,"total":1}'
  - event: handoff.execution_progress
    condition: { binding: outcome, equals: "success" }
    payload_template: '{"packet_id":"${packet_id}","executor_session_id":"${executor_session_id}","task_id":"t1","current_task":"t1","status":"completed","completed":1,"total":1}'
  - event: handoff.execution_progress
    condition: { binding: outcome, equals: "failure" }
    payload_template: '{"packet_id":"${packet_id}","executor_session_id":"${executor_session_id}","task_id":"t1","current_task":"t1","status":"failed","completed":0,"total":1}'
  - event: handoff.completed
    condition: { binding: outcome, equals: "success" }
    payload_template: '{"packet_id":"${packet_id}","executor_session_id":"${executor_session_id}","status":"completed","outcome":{"status":"success","tasks_completed":["t1"],"tasks_failed":[],"changeset_summary":"mock execution complete"}}'
  - event: handoff.failed
    condition: { binding: outcome, equals: "failure" }
    payload_template: '{"packet_id":"${packet_id}","executor_session_id":"${executor_session_id}","status":"failed","outcome":{"status":"failed","tasks_completed":[],"tasks_failed":["t1"],"changeset_summary":"mock execution failed"}}'

final_response:
  ok: true
  message_id: '${msg_id}'
  executor_session_id: '${executor_session_id}'

assertions:
  - "is_handoff_execution_submit branching mirrors legacy: presence of params.handoff_packet_id OR text contains 'VAC Web Handoff Packet' routes to handoff branch"
  - "normal branch emits 9 events (transcript.message_added + 5x transcript.delta via foreach + transcript.completed + tool_call.pending + review.changeset_updated) + response"
  - "handoff success branch emits 3 events (started + completed-progress + handoff.completed) + response with executor_session_id"
  - "handoff failure branch (force_failure or mode=='fail') emits 3 events (started + failed-progress + handoff.failed) + response"
  - "transcript.delta foreach exercises post-Pass-#36 audit fixup: outer condition gates the entire loop; handoff branch skips foreach entirely with zero body emissions"
  - "wire-byte deviation #3: final_response carries both message_id and executor_session_id with empty string for unused field; legacy parity test still passes (is_string() + ok==true)"
  - "counter bump ordering preserved: normal=+2 (msg_id, tool_call_id); handoff=+1 (exec_sid only)"
  - "handoff branch text-marker fallback: when only params.text triggers detection (no handoff_packet_id), packet_id falls back to 'pkt_unknown' (mirror legacy unwrap_or)"
