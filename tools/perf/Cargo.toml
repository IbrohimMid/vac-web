[features]
# When enabled, replaces Phase 1 synthetic measurements with real per-subsystem
# drivers under `src/scenarios/`. Off by default; enable locally with
# `--features real_scenarios` to capture real measurements. Drivers land
# incrementally — see `src/scenarios/mod.rs` for the current dispatch table.
real_scenarios = ["dep:local-bridge", "dep:tempfile", "dep:chrono", "dep:axum", "dep:tokio-tungstenite", "dep:futures"]

[package]
name = "perf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Backend SLO measurement harness for slice 41 (P1 observability) — produces JSON output for scripts/check-slo-measurements.mjs"

[[bin]]
name = "perf"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Real-scenario drivers (`--features real_scenarios`). Optional so default
# builds stay tiny and CI keeps the synthetic contract until baseline data
# stabilises.
local-bridge = { path = "../../apps/local-bridge", optional = true }
tempfile = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
