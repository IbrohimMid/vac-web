# Canonical OpenCode ACP fixture.
#
# Per https://opencode.ai/docs/acp the canonical command is
#   opencode acp
# (subcommand, not the deprecated `--acp` flag). The adapter speaks
# ACP over stdio. Optional flags: --cwd, --port, --hostname.
#
# Auth: OpenCode reads provider API keys from its own config or
# environment (OPENAI_API_KEY, ANTHROPIC_API_KEY, etc). It does not
# advertise an ACP authMethod, so the bridge does NOT synthesize a
# terminal-auth method for it (only `gemini-acp` is on the
# terminal-auth allowlist).
default_agent = "opencode"

[agents.opencode]
kind = "acp"
label = "OpenCode"
command = "opencode"
args = ["acp"]
dialect = "zed-acp"
enabled = true
permission_timeout_ms = 300000
env_allow = [
  "OPENCODE_*",
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "GROQ_API_KEY",
  "DEEPSEEK_API_KEY",
  "OPENROUTER_API_KEY",
  "MISTRAL_API_KEY",
  "XAI_API_KEY",
  "GOOGLE_GENERATIVE_AI_API_KEY",
]
cwd_mode = "project-root"
