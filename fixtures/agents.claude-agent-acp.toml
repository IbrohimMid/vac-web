# Canonical Claude ACP adapter fixture for @agentclientprotocol/claude-agent-acp.
default_agent = "claude-acp"

[agents.claude-acp]
kind = "acp"
label = "Claude Agent ACP"
command = "npx"
args = ["-y", "@agentclientprotocol/claude-agent-acp"]
dialect = "zed-acp"
enabled = true
permission_timeout_ms = 300000
env_allow = ["ANTHROPIC_*", "CLAUDE_*", "CLAUDE_CODE_EXECUTABLE"]
cwd_mode = "project-root"
