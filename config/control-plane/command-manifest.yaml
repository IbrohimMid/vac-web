    summary: Start a bridge-managed deployment and emit progress events.
  - id: release.publish
    status: implemented
    side_effect: external
    scope: session
    requires_profile_tool: publish.*
    summary: Publish the selected target through the bridge release plane.

  # Migration / continuous ------------------------------------------------
  - id: continuous.write_config
    status: not_wired
    side_effect: state
    scope: sessionless
    ui:
      gate: disabled
      reason: Continuous config write is held until validate+rollback exist.
  - id: migration.create_draft
    status: not_wired
    side_effect: state
    scope: session
    ui:
      gate: disabled
  - id: migration.dry_run
    status: not_wired
    side_effect: read_only
    scope: session
    ui:
      gate: disabled
  - id: migration.verify_reversibility
    status: not_wired
    side_effect: read_only
    scope: session
    ui:
      gate: disabled
  - id: migration.dispatch
    status: not_wired
    side_effect: external
    scope: session
    ui:
      gate: disabled

  # Registry / config -----------------------------------------------------
  - id: registry.sync
    status: implemented
    side_effect: state
    scope: sessionless
  - id: registry.add
    status: implemented
    side_effect: state
    scope: sessionless
  - id: registry.reload
    status: implemented
    side_effect: state
    scope: sessionless
  - id: config.validate
    status: implemented
    side_effect: read_only
    scope: sessionless
  - id: config.reload
    status: implemented
    side_effect: state
    scope: sessionless
  - id: config.policy.get
    status: implemented
    side_effect: read_only
    scope: sessionless

  # Transcript (internal/protocol-only) -----------------------------------
