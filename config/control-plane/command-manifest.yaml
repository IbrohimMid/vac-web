  - id: release.generate_notes
    status: implemented
    side_effect: state
    scope: session
    requires_profile_tool: release_notes.write
    summary: Generate a draft release notes event for the selected target.
  - id: release.deploy
    status: implemented
    side_effect: external
    scope: session
