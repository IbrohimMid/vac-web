    status: not_wired
    side_effect: state
    scope: session
  - id: handoff.cancel
    status: not_wired
    side_effect: state
    scope: session
  - id: handoff.status
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session

  # Gates -----------------------------------------------------------------
  - id: gate.evaluate
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    summary: Emit the current gate snapshot for a session.
  - id: gate.signoff
    status: implemented
    side_effect: state
    scope: session
    requires_profile_tool: gate.signoff
    summary: Record a gate sign-off and persist it.
  - id: gate.override
    status: implemented
    side_effect: state
    scope: session
    requires_profile_tool: gate.override
    summary: Persist an audit-logged gate override with expiry.
  - id: gate.revoke_override
    status: implemented
    side_effect: state
    scope: session
    requires_profile_tool: gate.override
    summary: Revoke an active gate override.
  - id: gate.sync_mutation_audit
    status: implemented
    side_effect: state
    scope: session
    tool_enforcement: protocol_only
    summary: Replay outstanding bridge.mutation lifecycle events for the active session.

  # Connectors ------------------------------------------------------------
  - id: connector.list
    status: not_wired
    side_effect: read_only
    scope: sessionless
    summary: Connector registry surface is held until v0 local registry lands.
  - id: connector.connect
    status: not_wired
    side_effect: external
    scope: sessionless
