    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: handoff.fetch
    status: not_wired
    side_effect: read_only
    scope: session
  - id: handoff.approve
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: handoff.reject
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
