  - id: plan.approve
    status: not_wired
    side_effect: state
    scope: session
    ui:
      gate: disabled
  - id: plan.reject
    status: not_wired
    side_effect: state
    scope: session
    ui:
      gate: disabled

  # Shell -----------------------------------------------------------------
  - id: shell.start
    status: not_wired
    side_effect: state
    scope: session
    requires_profile_tool: shell.exec
    ui:
      gate: disabled
      reason: Shell backend is not implemented yet.
  - id: shell.input
    status: not_wired
    side_effect: state
    scope: session
    requires_profile_tool: shell.exec
  - id: shell.resize
    status: not_wired
    side_effect: state
    scope: session
    requires_profile_tool: shell.exec
  - id: shell.kill
    status: not_wired
    side_effect: state
    scope: session
    requires_profile_tool: shell.exec

  # Context / palette -----------------------------------------------------
  - id: context.attach_files
    status: not_wired
    side_effect: state
    scope: session
    requires_profile_tool: fs.read
    ui:
      gate: disabled
      reason: File attach respects project-root/profile policy; not wired.
  - id: context.mention_search
    status: not_wired
    side_effect: read_only
    scope: session
    summary: Mention search is held until local indexes are wired.
  - id: palette.invoke_action
    status: not_wired
    tool_enforcement: payload_action_id
    side_effect: state
    scope: session
    summary: Generic palette invoke must map to a concrete command before execution.
    ui:
      gate: disabled
      reason: Palette actions must be classified before they execute.


  # Code Workspace bridge contracts ---------------------------------------
  - id: project.tree.request
    status: implemented
    side_effect: read_only
    scope: session
    requires_profile_tool: fs.read
    summary: Return a safe project tree rooted at the active session project.
  - id: project.file.request
    status: implemented
    side_effect: read_only
    scope: session
    requires_profile_tool: fs.read
    summary: Return UTF-8 text file contents with binary and size guards.
  - id: coding.context.ask_about_file
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Forward file context to the active agent as a structured prompt.
  - id: coding.context.ask_about_selection
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Forward selected lines to the active agent as a structured prompt.
  - id: coding.context.request_edit
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Ask the active agent to edit a file using current workspace context.
  - id: coding.context.request_tests
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Ask the active agent to generate or update tests for a file.
  - id: workspace.preview.open
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    summary: Record a local preview URL and emit workspace.preview.updated.
  - id: workspace.preview.refresh
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    summary: Refresh the current preview state.
  - id: workspace.preview.stop
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    summary: Mark the preview as stopped.
  - id: workspace.preview.send_context
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Forward explicit preview context to the active agent.
  - id: workspace.preview.run_e2e
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    summary: Record an E2E validation request for the current preview.
  - id: validation.run.request
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Record a validation run request and forward validation intent to the active agent.
  - id: validation.failure.send_context
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Send a selected validation failure context to the active agent.
  - id: task.execution.continue
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Continue the active coding task through the agent.
  - id: task.plan.request_changes
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
    runtime: agent_forwarded
    summary: Ask the agent to revise the active task plan.
  - id: workspace.branch.request
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
    summary: Return the active git branch for the session project root.

  # Assessment ------------------------------------------------------------
  - id: assessment.run
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: assessment.sweep.run
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: assessment.sweep.cancel
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: assessment.list_runs
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
  - id: assessment.fetch_report
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
  - id: assessment.fetch_evidence_preview
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
  - id: assessment.cancel
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: assessment.replay
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session
  - id: assessment.diff
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
  - id: assessment.index.status
    status: implemented
    tool_enforcement: protocol_only
    side_effect: read_only
    scope: session
  - id: assessment.index.rebuild
    status: implemented
    tool_enforcement: protocol_only
    side_effect: state
    scope: session

  # Handoff ---------------------------------------------------------------
