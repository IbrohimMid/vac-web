# Canonical event catalog (slice 32 step_01).
#
# This file is the source of truth for every event the bridge or web cockpit
# emits or consumes. Generated bindings live in:
#   * apps/local-bridge/src/generated/event_catalog.rs
#   * apps/web/src/generated/eventCatalog.ts
#
# Migration rule:
#   1. New events must land here BEFORE being emitted in code.
#   2. Mock-engine may use canonical events or `legacy_mock_only` events.
#      Legacy mock events MUST declare a replacement.
#   3. Capability classifier modules under apps/web/src/domain/capabilities/
#      consume IDs from the generated TS catalog, not inline strings.

version: 1
status: shipped # generated bindings are enforced by scripts/verify-codegen.sh

events:
  # ---- session lifecycle -------------------------------------------------
  - id: session.started
    owner: bridge
    status: implemented
    producer: translator.session_started
    consumers:
      - domain.sessions.handlers
      - SessionPicker
      - capabilities.sessionLifecycle
  - id: session.closed
    owner: bridge
    status: implemented
    producer: translator.session_closed
    consumers:
      - domain.sessions.handlers
      - capabilities.sessionLifecycle
  - id: session.context.updated
    owner: bridge
    status: implemented
    producer: session.handle.prompt_response_usage
    consumers:
      - domain.sessions.handlers
      - Topbar.ModelContextChip
  - id: session.renamed
    owner: bridge
    status: implemented
    producer: translator.session_renamed
    consumers:
      - SessionPicker
      - capabilities.sessionLifecycle

  - id: session.persistence_degraded
    owner: bridge
    status: implemented
    producer: session.persistence.sink
    consumers:
      - capabilities.persistenceEvents
      - domain.sessions.history
      - NotifyLane
  - id: session.mcp_server_drift
    owner: bridge
    status: implemented
    producer: translator.session_resume
    consumers:
      - capabilities.registryEvents
      - domain.sessions.history
      - ResumeStatus
      - PersistentSessions

  # ---- review taxonomy ---------------------------------------------------
  - id: review.changeset_updated
    owner: bridge
    status: implemented
    producer: translator.review_changeset_updated
    consumers:
      - domain.review.handlers
  - id: review.file_diff_chunk
    owner: bridge
    status: implemented
    producer: translator.review_file_diff_chunk
    consumers:
      - domain.review.handlers

  # ---- assessment index --------------------------------------------------
  - id: assessment.index.rebuild_started
    owner: bridge
    status: implemented
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.index.rebuild_progress
    owner: bridge
    status: implemented
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.index.rebuilt
    owner: bridge
    status: implemented
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.index.rebuild_failed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.index.status_failed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.assessmentIndex

  # ---- workflow ----------------------------------------------------------
  - id: workflow.started
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.step.started
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.step.updated
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.step.completed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.step.failed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.completed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.failed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.artifact.created
    owner: bridge
    status: implemented
    consumers:
      - capabilities.workflowEvents
  - id: workflow.input.message_submit
    owner: bridge
    status: implemented
    internal: true
    consumers:
      - capabilities.workflowEvents

  # ---- tool activity -----------------------------------------------------
  - id: tool.observed
    owner: bridge
    status: implemented
    producer: session.handle.tool_activity
    consumers:
      - domain.toolActivity.handlers
      - stores.toolActivity
      - workflows.adapters
  - id: tool.updated
    owner: bridge
    status: implemented
    producer: session.handle.tool_activity
    consumers:
      - domain.toolActivity.handlers
      - stores.toolActivity
      - workflows.adapters
  - id: tool.failed
    owner: bridge
    status: implemented
    producer: session.handle.tool_activity
    consumers:
      - domain.toolActivity.handlers
      - stores.toolActivity
      - workflows.adapters

  # ---- shell / terminal --------------------------------------------------
  - id: shell.started
    owner: bridge
    status: not_wired
    consumers:
      - capabilities.shellTerminal
  - id: shell.output
    owner: bridge
    status: not_wired
    consumers:
      - capabilities.shellTerminal
  - id: terminal.activity
    owner: bridge
    status: implemented
    consumers:
      - capabilities.shellTerminal

  # ---- handoff -----------------------------------------------------------
  - id: handoff.execution_progress
    owner: bridge
    status: implemented
    consumers:
      - capabilities.handoffErrors
  - id: handoff.completed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.handoffErrors

  # ---- gate governance --------------------------------------------------
  - id: gate.changed
    owner: bridge
    status: implemented
    classification: implemented
    producer: gate.handlers
    consumers:
      - domain.gates.handlers
      - GateDetail
      - ReleaseTab

  # ---- runtime jobs ------------------------------------------------------
  - id: runtime.job_started
    owner: bridge
    status: implemented
    consumers:
      - capabilities.runtimeJobs
  - id: runtime.job_completed
    owner: bridge
    status: implemented
    consumers:
      - capabilities.runtimeJobs

  # ---- activity log ------------------------------------------------------
  - id: activity.appended
    owner: bridge
    status: implemented
    producer: translator.activity_appended
    consumers:
      - capabilities.notifyAttention

  # ---- assessment streaming ---------------------------------------------
  - id: assessment.candidate_received
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.candidate_rejected
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.evidence_attached
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.finding_added
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.progress
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.sweep.started
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.sweep.progress
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex
  - id: assessment.worker_output_rejected
    owner: bridge
    status: implemented
    producer: translator.assessment
    consumers:
      - capabilities.assessmentIndex

  # ---- pairing (HTTP token exchange) ------------------------------------
  - id: pairing.mint
    owner: bridge
    status: implemented
    producer: auth.mint_pair
    consumers:
      - audit.pairing_shard
  - id: pairing.exchange
    owner: bridge
    status: implemented
    producer: auth.exchange_pair
    consumers:
      - audit.pairing_shard
  - id: pairing.exchange_denied
    owner: bridge
    status: implemented
    producer: auth.exchange_pair
    consumers:
      - audit.pairing_shard

  # ---- websocket lifecycle ----------------------------------------------
  - id: ws.connected
    owner: bridge
    status: implemented
    producer: ws.handler.run_socket
    consumers:
      - audit.ws_shard
  - id: ws.disconnected
    owner: bridge
    status: implemented
    producer: ws.handler.run_socket
    consumers:
      - audit.ws_shard
  - id: ws.auth_failed
    owner: bridge
    status: implemented
    producer: ws.handler.run_socket
    consumers:
      - audit.ws_shard

  # ---- release ----------------------------------------------------------
  # Slice 14 step_01 classification (Pass #27 verification, mirrored from
  # apps/web/src/domain/release/releaseEvents.ts). The `classification` field
  # is metadata-only; codegen treats it as opaque. Values:
  #   implemented  — backend wired + safe for production usage
  #   draft_only   — emitted but explicitly labeled draft in UX
  #   mock_only    — only mock-engine emits; backend disabled until gates land
  #   future       — reserved id; not yet emitted anywhere
  - id: release.targets
    owner: bridge
    status: implemented
    classification: implemented
    producer: release.handlers
    consumers:
      - domain.release.handlers
      - ReleaseTab
  - id: release.notes_draft
    owner: bridge
    status: implemented
    classification: draft_only
    producer: release.handlers
    consumers:
      - domain.release.handlers
      - ReleaseTab
  - id: release.deploy_progress
    owner: bridge
    status: implemented
    classification: implemented
    producer: release.handlers
    consumers:
      - domain.release.handlers
      - ReleaseTab
  - id: release.post_deploy_observation
    owner: bridge
    status: implemented
    classification: implemented
    producer: release.handlers
    consumers:
      - domain.release.handlers
      - ReleaseTab

  # ---- extensions surface ------------------------------------------------
  - id: extensions.list_response
    owner: bridge
    status: implemented
    producer: translator.extensions_list
    consumers:
      - domain.extensions.handlers
      - ExtensionsList
  - id: extensions.updated
    owner: bridge
    status: implemented
    producer: translator.extensions_update_trust
    consumers:
      - domain.extensions.handlers
      - ExtensionsList

  - id: extensions.update_trust.allowed
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_update_trust
    consumers:
      - audit
  - id: extensions.update_trust.denied
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_update_trust
    consumers:
      - audit
  - id: extensions.update_trust.save_failed
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_update_trust
    consumers:
      - audit

  - id: extensions.promotion_requested
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_request_promotion
    consumers:
      - audit
      - ExtensionsList
  - id: extensions.promotion_approved
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_approve_promotion
    consumers:
      - audit
      - ExtensionsList
  - id: extensions.promotion_denied
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_approve_promotion
    consumers:
      - audit
      - ExtensionsList
  - id: extensions.approvals_list_response
    owner: bridge
    status: implemented
    producer: extensions.handlers.handle_list_approvals
    consumers:
      - ExtensionsList

  # ---- perf surface ------------------------------------------------------
  - id: perf.run_completed
    owner: bridge
    status: implemented
    producer: perf.handle_latest_run
    consumers:
      - PerfBadge

  # ---- legacy / mock-only adapters --------------------------------------
  - id: changeset.updated
    owner: mock
    status: legacy_mock_only
    replacement: review.changeset_updated
    consumers:
      - tools.mock_engine.scenarios
