apps/local-bridge/src/session/mod.rs: bridge.session
apps/local-bridge/src/storage/mod.rs: bridge.storage
apps/local-bridge/src/translator/mod.rs: bridge.translator
apps/local-bridge/src/workflows/mod.rs: bridge.workflows
apps/local-bridge/src/ws/mod.rs: bridge.ws
apps/local-bridge/src/notify.rs: bridge.notify
apps/local-bridge/src/observability.rs: bridge.observability
apps/local-bridge/src/server.rs: bridge.server
apps/local-bridge/src/tunnel.rs: bridge.tunnel
apps/local-bridge/src/capabilities.rs: bridge.capability_registry
