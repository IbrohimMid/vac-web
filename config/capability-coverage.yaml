# config/capability-coverage.yaml
#
# Capability classifier coverage manifest (slice 1.2 + 5.1, 2026-05-06).
#
# Every backend code class under apps/local-bridge/src/ MUST appear here with
# the capability id it implements. The CI gate
# (scripts/check-capability-coverage.mjs) validates that this manifest is in
# sync with the filesystem layout.
#
# Adding a new backend module: append `<path>: <capability_id>` here, then run
# `node scripts/check-capability-coverage.mjs` locally to confirm.
#
# See docs/capabilities/README.md for the convention.

apps/local-bridge/src/agent_runtime/mod.rs: bridge.agent_runtime
