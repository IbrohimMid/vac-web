id: assessor.rtd@1.0.0
class: assessor
version: 1.0.0
inherits_from: assessor.base@1.0.0
description: Ready-to-Deploy assessor family. Inherits base deny floor + shell allowlist.
tool_allow: []
tool_deny: []
shell_allowlist: []
fs:
  read: project_and_docs
  write: none
git:
  read: true
  branch: false
  commit: false
  tag: false
  push: false
connectors:
  read: [github, sentry, datadog, cloudflare, vercel, ci]
  write: []
network_egress:
  mode: allowlist
  host_allowlist:
    - api.github.com
    - sentry.io
    - api.datadoghq.com
    - api.cloudflare.com
    - api.vercel.com
  methods_allow: [GET, HEAD, OPTIONS]
approval_required_for: []
