id: assessor.growth@1.0.0
class: assessor
version: 1.0.0
inherits_from: assessor.base@1.0.0
description: Growth Readiness assessor family.
tool_allow: []
tool_deny: []
shell_allowlist: []
fs: { read: project_and_docs, write: none }
git: { read: true, branch: false, commit: false, tag: false, push: false }
connectors:
  read: [github, posthog, ga4, mixpanel]
  write: []
network_egress:
  mode: allowlist
  host_allowlist:
    - api.github.com
    - app.posthog.com
    - analyticsdata.googleapis.com
    - api.mixpanel.com
  methods_allow: [GET, HEAD, OPTIONS]
approval_required_for: []
