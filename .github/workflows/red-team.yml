name: red-team

on:
  pull_request:
  push:
    branches: [main]

jobs:
  redteam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate protocol code
        run: bash scripts/codegen.sh
      - name: Build mock-engine binary
        run: cargo build -p mock-engine
      - run: cargo test -p red-team --features redteam --no-fail-fast
      - name: Summary report
        if: always()
        run: echo "See tests/red-team/README.md for matrix coverage."
