name: Perf measurements (slice 41 R6)

on:
  schedule:
    # Weekly: every Monday at 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  perf:
    name: Backend SLO perf harness (strict baseline gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install Node deps
        run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml', 'pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm -F web exec playwright install --with-deps chromium
      - name: Restore perf baseline history
        id: perf-baseline-restore
        uses: actions/cache/restore@v4
        with:
          path: .perf-baseline/history.jsonl
          key: perf-baseline-history-${{ github.run_id }}
          restore-keys: |
            perf-baseline-history-
      - name: Build perf harness (real scenarios)
        run: cargo build -p perf --release --features real_scenarios
      - name: Run perf harness (real scenarios)
        run: cargo run -p perf --release --features real_scenarios -- --duration 60 --output perf-results.json
      - name: Check measurements vs budgets (measurement-only)
        # SLO budget gate stays measurement-only: budgets are static targets,
        # not historical comparisons. Rolling baseline gate below is the F4
        # strict-flip surface.
        run: node scripts/check-slo-measurements.mjs perf-results.json --measurement-only
      - name: Archive perf baseline
        env:
          PERF_MEASUREMENTS_FILE: perf-results.json
        run: node scripts/perf-baseline-archive.mjs
      - name: Save perf baseline history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .perf-baseline/history.jsonl
          key: perf-baseline-history-${{ github.run_id }}
      - name: Compare against rolling perf baseline (F4 strict gate)
        # F4 strict flip 2026-05-10. The compare script self-loosens during
        # baseline warmup (window < 5 entries), so this step only fails the
        # workflow once history.jsonl has accumulated enough samples for
        # statistically meaningful gating. See scripts/perf-baseline-compare.mjs
        # MIN_STRICT_WINDOW.
        run: node scripts/perf-baseline-compare.mjs --window 10 --threshold 25 --strict
      - name: Upload perf baseline history
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-baseline-history
          path: .perf-baseline/history.jsonl
          retention-days: 90
      - name: Upload measurements artifact
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: perf-results.json
          retention-days: 30
