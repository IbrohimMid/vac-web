name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generate protocol code
        run: bash scripts/codegen.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate protocol code
        run: bash scripts/codegen.sh
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Bundle size budget
        # Blocking: size-limit is in the lockfile. Budgets live in
        # `apps/web/package.json` size-limit config block. Bumps must be
        # justified by a measured improvement or PR description.
        run: pnpm --filter @vac-web/web exec size-limit

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/schema-validate.sh
      - run: bash scripts/manifest-verify.sh

  # Slice 37: import-graph fitness test. Walks apps/web/src and rejects
  # cross-layer imports that violate docs/module-boundaries.md.
  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/check-architecture-boundaries.mjs

  # Slice 1.2 + 5.1 closeout (2026-05-06): capability classifier coverage.
  # Every backend module under apps/local-bridge/src/ must be mapped to a
  # capability id in config/capability-coverage.yaml. See
  # docs/capabilities/README.md for the convention.
  capability-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/check-capability-coverage.mjs

  # Slice 8.3 closeout (2026-05-06): SLO budget validator. Parses the slos:
  # YAML block in docs/plans/wiring/41-observability-slos.md and asserts
  # every entry is a well-formed _p<n>_ms key with a positive numeric ms
  # target in 1..60000ms.
  slo-budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/check-slo-budgets.mjs
