# cargo-deny configuration. Enforces license + advisory + multiple-version
# hygiene for the Rust workspace. Tuned conservatively for a v1 release.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"
# Individual advisories can be ignored here with justification comments.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
