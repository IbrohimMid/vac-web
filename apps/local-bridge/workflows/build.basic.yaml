version: 1
metadata:
  id: build.basic
  name: Basic Build Workflow
activities:
  - id: trigger
    kind: trigger
    label: "Workflow started"
  - id: prompt_agent
    kind: prompt_agent
    label: "Prompt agent"
  - id: observe_tools
    kind: observe_tool_activity
    label: "Observe tool activity"
  - id: end
    kind: end
    label: "Workflow complete"
flows:
  - from: trigger
    to: prompt_agent
    on: message.submit
  - from: prompt_agent
    to: observe_tools
    on: tool.observed
  - from: observe_tools
    to: end
    on: transcript.completed
